name: Scheduled Fuel Price Crawler

on:
  schedule:
    # Runs every 6 hours aligned with 12:00 AM Midnight Pakistan Standard Time (UTC+5):
    # 19:00 UTC = 12:00 AM Midnight PKT (Daily midnight cycle)
    # 01:00 UTC = 06:00 AM PKT (6 hours later)
    # 07:00 UTC = 12:00 PM Noon PKT (6 hours later)
    # 13:00 UTC = 06:00 PM PKT (6 hours later)
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: # Allows instant manual trigger anytime from GitHub Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Fuel Price Crawler Endpoint
        run: |
          TARGET_URL="${{ secrets.SITE_URL || secrets.NETLIFY_SITE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "Error: Neither SITE_URL nor NETLIFY_SITE_URL secret is defined!"
            exit 1
          fi
          # Strip trailing slash if present
          TARGET_URL="${TARGET_URL%/}"
          echo "Target crawler URL: $TARGET_URL/api/cron/check-prices"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$TARGET_URL/api/cron/check-prices" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -n 's/.*HTTP_STATUS://p')
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Crawler endpoint failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "All 6 fuel rates scraped and verified successfully."
