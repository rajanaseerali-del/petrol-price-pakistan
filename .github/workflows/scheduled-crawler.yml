name: Scheduled Fuel Price Crawler

on:
  schedule:
    # Runs everyday at 12:00 AM midnight Pakistan Standard Time (19:00 UTC)
    - cron: '0 19 * * *'
    # Also runs every 6 hours as a backup to catch mid-day announcements
    - cron: '0 6,12,18 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Fuel Price Crawler Endpoint
        run: |
          TARGET_URL="${{ secrets.SITE_URL || secrets.NETLIFY_SITE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "Error: Neither SITE_URL nor NETLIFY_SITE_URL secret is defined!"
            exit 1
          fi
          # Strip trailing slash if present
          TARGET_URL="${TARGET_URL%/}"
          echo "Target crawler URL: $TARGET_URL/api/cron/check-prices"
          
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X GET "$TARGET_URL/api/cron/check-prices" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | tr -d '\r' | sed -n 's/.*HTTP_STATUS://p')
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Crawler endpoint failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Crawler check and auto-sync completed successfully."
