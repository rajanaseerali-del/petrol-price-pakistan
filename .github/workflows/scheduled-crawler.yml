name: Scheduled Fuel Price Crawler

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Fuel Price Crawler Endpoint
        run: |
          curl -s -X GET "${{ secrets.NETLIFY_SITE_URL }}/api/cron/check-prices" \
               -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
